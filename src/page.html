<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radar dos Editais</title>
  <meta http-equiv="Cache-Control" content="no-store" />
  <!-- radar jornal v0.3 -->
  <meta name="description" content="Concursos e editais lidos no Diário Oficial do Estado da Paraíba. Recorte João Pessoa. Fonte oficial, sem lista inventada." />
  <meta name="theme-color" content="#1b1712" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,650&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f3ead6; --ink: #1b1712; --rule: #c9b896; --muted: #5a5147;
      --stamp: #9c2d22; --stamp-ink: #7c2118; --card: #fbf6ea; --chip: #e8dcc4;
      --error-bg: #efdccf; --selected: #efe3c9; --canvas: #e3d6bb;
      --display: "Fraunces", "Times New Roman", serif;
      --sans: "Source Sans 3", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    button, [role="button"] { cursor: pointer; }
    button { font-family: inherit; }
    input, select { font-family: inherit; border-radius: 0; }
    a { color: inherit; }
    h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
    .dot { width: 10px; height: 10px; background: var(--stamp); flex-shrink: 0; }
    header.top { border-bottom: 1px solid var(--ink); padding: 12px 16px; display: flex; align-items: center; gap: 24px; }
    header.top .city-m { margin-left: auto; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
    .search { position: relative; flex: 1; max-width: 520px; display: none; }
    .search input, .field input, .field select, .q { width: 100%; height: 44px; border: 1px solid var(--ink); background: var(--card); padding: 0 12px 0 40px; font-size: 16px; color: var(--ink); outline: none; }
    .field input, .field select { padding-left: 12px; height: 48px; }
    .search svg { position: absolute; left: 12px; top: 12px; width: 16px; height: 16px; color: var(--muted); }
    nav.desk { display: none; gap: 20px; margin-left: auto; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    nav.desk a { text-decoration: none; color: var(--muted); padding-bottom: 4px; }
    nav.desk a.on { color: var(--ink); border-bottom: 3px solid var(--stamp); }
    .src { border-bottom: 1px solid var(--rule); padding: 10px 16px; font-size: 12px; font-variant-numeric: tabular-nums; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .src strong { font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 0; }
    .chip { height: 44px; padding: 0 12px; border: 1px solid var(--rule); background: transparent; font-size: 13px; font-weight: 600; color: var(--ink); }
    .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .chip.stamp { border-color: var(--stamp); color: var(--stamp-ink); }
    .count { padding: 8px 16px 12px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .fail { margin: 12px 16px 0; border: 1px solid var(--stamp); background: var(--error-bg); padding: 14px; }
    .fail .k { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--stamp-ink); }
    .fail p { margin: 8px 0 0; font-size: 15px; font-weight: 600; line-height: 1.3; }
    .fail .m { font-size: 12px; font-weight: 400; color: var(--muted); }
    .fail button { margin-top: 4px; background: none; border: 0; min-height: 44px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--stamp-ink); padding: 0; }
    .list { padding: 12px 16px 80px; display: flex; flex-direction: column; gap: 12px; }
    .card { border: 1px solid var(--rule); background: var(--card); display: flex; flex-direction: column; text-align: left; color: inherit; text-decoration: none; }
    .card.sel { border-color: var(--stamp); border-left-width: 4px; background: var(--selected); }
    .card .body { padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; background: none; border: 0; text-align: left; color: inherit; width: 100%; }
    .card h2 { margin: 0; font-size: 17px; line-height: 1.25; flex: 1; }
    .row { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
    .meta { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .prazo { font-size: 14px; line-height: 1.3; font-variant-numeric: tabular-nums; margin: 0; }
    .fonte { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin: 0; }
    .pdf { display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 12px; border-top: 1px solid var(--rule); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; }
    .stamp { flex-shrink: 0; padding: 6px; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; line-height: 1.15; text-align: center; }
    .stamp.solid { background: var(--stamp); color: var(--paper); }
    .stamp.ghost { border: 1px solid var(--ink); }
    .stamp.mute { border: 1px solid var(--muted); color: var(--muted); }
    .shell { min-height: 100dvh; }
    .split { display: block; }
    aside.ficha { display: none; }
    nav.bottom { position: fixed; inset: auto 0 0 0; height: 60px; border-top: 1px solid var(--ink); background: var(--paper); display: flex; z-index: 20; }
    nav.bottom a { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; color: var(--muted); }
    nav.bottom a + a { border-left: 1px solid var(--rule); }
    nav.bottom a.on { color: var(--ink); border-bottom: 3px solid var(--stamp); }
    .empty { border: 1px solid var(--ink); background: var(--card); padding: 20px; }
    .empty h2 { margin: 0; font-size: 22px; }
    .empty p { color: var(--muted); font-size: 14px; }
    .btn { display: flex; width: 100%; height: 48px; align-items: center; justify-content: center; background: var(--ink); color: var(--paper); border: 0; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; }
    .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
    .btn.stamp { color: var(--stamp-ink); border-color: var(--stamp); background: transparent; }
    .q-m { display: block; padding: 0 16px; }
    .q-m .search { display: block; max-width: none; }
    .auth { max-width: 28rem; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
    .auth main { padding: 32px 20px 20px; display: flex; flex-direction: column; gap: 20px; flex: 1; }
    .auth h1 { font-size: 32px; margin: 0; letter-spacing: -.015em; line-height: 1.05; }
    .auth .kicker { color: var(--muted); font-size: 15px; margin: 6px 0 0; }
    .auth footer { border-top: 1px solid var(--rule); padding: 16px 20px; font-size: 13px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field span { font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .err { border: 1px solid var(--stamp); background: var(--error-bg); padding: 12px 14px; font-size: 14px; font-weight: 600; color: var(--stamp-ink); display: flex; gap: 10px; align-items: start; }
    .err i { width: 8px; height: 8px; background: var(--stamp); margin-top: 6px; flex-shrink: 0; display: block; }
    .back { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--rule); padding: 12px 16px; text-decoration: none; }
    .back b { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; }
    .page { padding-bottom: 60px; }
    .page h1 { font-size: 24px; margin: 0; }
    .page .lead { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
    .hd { border-bottom: 1px solid var(--rule); padding: 14px 16px; }
    .rowline { min-height: 64px; border-bottom: 1px solid var(--rule); padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    .rowline .lab { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .sw { width: 52px; height: 30px; border: 1px solid var(--ink); background: var(--card); display: flex; align-items: center; padding: 2px; flex-shrink: 0; }
    .sw.on { background: var(--ink); justify-content: flex-end; border-color: var(--ink); }
    .sw i { width: 24px; height: 24px; background: var(--rule); display: block; }
    .sw.on i { background: var(--paper); }
    .detail { display: flex; flex-direction: column; min-height: calc(100dvh - 120px); }
    .detail .scroll { flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; overflow: auto; }
    .detail .k { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .detail h1 { font-size: 28px; margin: 0; line-height: 1.12; }
    .detail blockquote { margin: 0; border: 1px solid var(--rule); background: var(--card); padding: 12px; font-size: 14px; font-style: italic; line-height: 1.5; }
    .dates { display: flex; border: 1px solid var(--rule); background: var(--card); }
    .dates div { flex: 1; padding: 12px; }
    .dates div + div { border-left: 1px solid var(--rule); }
    .dates span { display: block; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .dates b { font-size: 18px; font-variant-numeric: tabular-nums; }
    .box { border: 1px solid var(--ink); padding: 12px; font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; }
    .foot { border-top: 1px solid var(--ink); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .drawer { position: fixed; inset: 0; z-index: 40; display: none; }
    .drawer.open { display: block; }
    .drawer .bg { position: absolute; inset: 0; background: rgba(27,23,18,.8); }
    .drawer .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 92dvh; background: var(--paper); border-top: 1px solid var(--ink); display: flex; flex-direction: column; }
    .drawer .hh { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--ink); padding: 10px 16px; }
    .drawer .hh h2 { margin: 0; font-size: 24px; }
    .drawer .body { flex: 1; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 20px; }
    .drawer h3 { margin: 0 0 8px; font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .clist { border: 1px solid var(--rule); background: var(--card); }
    .clist button { width: 100%; height: 46px; border: 0; border-bottom: 1px solid var(--rule); background: transparent; text-align: left; padding: 0 12px; font-size: 15px; }
    .clist button.on { background: var(--ink); color: var(--paper); font-weight: 600; }
    .drawer .ff { display: flex; flex-wrap: wrap; gap: 8px; }
    .drawer .bar { display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--ink); padding: 12px 16px; }
    .drawer .bar p { flex: 1; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--stamp-ink); margin: 0; }
    .ok { border: 1px solid var(--ink); background: var(--card); padding: 14px; font-weight: 600; }
    @media (min-width: 1024px) {
      .search { display: block; }
      nav.desk { display: flex; }
      header.top .city-m, nav.bottom, .q-m { display: none; }
      .split { display: grid; grid-template-columns: 520px 1fr; }
      .split .col { border-right: 1px solid var(--ink); }
      aside.ficha { display: flex; }
      .list { padding-bottom: 24px; }
      .page, .auth { padding-bottom: 0; }
      .detail .scroll { padding: 24px 32px; }
      .detail h1 { font-size: 34px; }
    }
  </style>
</head>
<body>
  <noscript>
    <header class="top"><div class="brand"><span class="dot"></span>Radar dos Editais</div></header>
    <main style="padding:24px;max-width:40rem">
      <p class="kicker">DOE-PB · João Pessoa</p>
      <h1>Ligue o JavaScript para abrir o radar.</h1>
      <p>Concursos e convocações lidos no Diário Oficial do Estado da Paraíba.</p>
    </main>
  </noscript>
  <div id="root"></div>
  <script>
  const CIDADES = ["João Pessoa","Campina Grande","Bayeux","Santa Rita","Patos","Sousa","Cajazeiras","Guarabira","Araruna","São José do Sabugi","Aroeiras","Piancó","Alhandra","Coremas","São Bento"];
  const TIPO = {concurso:"Concurso", convocacao:"Convocação", inscricao:"Inscrição", selecao:"Seleção"};
  const ESFERA = {municipal:"Municipal", estadual:"Estadual", federal:"Federal"};
  const STATUS = {aberto:"Aberto","fecha-7":"Fecha em 7 dias", fechado:"Fechado", previsto:"Previsto"};

  const $ = (s) => document.querySelector(s);
  function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function today(){ return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Recife",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }
  function br(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y; }
  function path(){ return location.pathname.replace(/\/+$/,"") || "/"; }
  function go(p, replace){ if(replace) history.replaceState(null,"",p); else history.pushState(null,"",p); render(); window.scrollTo(0,0); }

  function computeStatus(a, t){
    const de=a.inscricoesDe, ate=a.inscricoesAte;
    if(de && de>t) return "previsto";
    if(ate && ate<t) return "fechado";
    if(de && de<=t && ate && ate>=t){
      const days=(Date.parse(ate+"T12:00:00-03:00")-Date.parse(t+"T12:00:00-03:00"))/86400000;
      return days<=7 ? "fecha-7" : "aberto";
    }
    if(!de && !ate) return a.tipo==="convocacao" ? "aberto" : "previsto";
    if(de && de<=t && !ate) return "aberto";
    return "previsto";
  }
  function withStatus(itens){ const t=today(); return itens.map(a => Object.assign({}, a, {status: computeStatus(a,t)})); }
  function filterAtos(itens, f){
    const n=f.q.trim().toLowerCase();
    return itens.filter(a => {
      if(f.cidade && f.cidade!=="todas" && a.cidade!==f.cidade) return false;
      if(f.status!=="todos"){
        if(f.status==="aberto"){ if(a.status!=="aberto" && a.status!=="fecha-7") return false; }
        else if(a.status!==f.status) return false;
      }
      if(f.tipo!=="todos" && a.tipo!==f.tipo) return false;
      if(f.esfera!=="todos" && a.esfera!==f.esfera) return false;
      if(!n) return true;
      return (a.orgao+" "+a.titulo+" "+(a.trecho||"")+" "+(a.banca||"")+" "+a.cidade).toLowerCase().includes(n);
    });
  }
  function sortAtos(itens){
    const rank={"fecha-7":0, aberto:1, previsto:2, fechado:3};
    return itens.slice().sort((a,b)=>{
      const r=rank[a.status]-rank[b.status]; if(r) return r;
      const aa=a.inscricoesAte||"9999-99-99", bb=b.inscricoesAte||"9999-99-99";
      if(aa!==bb) return aa.localeCompare(bb);
      return b.data.localeCompare(a.data);
    });
  }
  function prazo(a){
    if(a.inscricoesAte){
      const b=a.banca?" · Banca: "+a.banca:"";
      if(a.status==="fechado") return "Inscrições encerradas em "+br(a.inscricoesAte)+b;
      if(a.status==="previsto" && a.inscricoesDe) return "Inscrições de "+br(a.inscricoesDe)+" a "+br(a.inscricoesAte)+b;
      return "Inscrições até "+br(a.inscricoesAte)+b;
    }
    if(a.tipo==="convocacao") return "Convocação vigente · banca não informada no trecho";
    return a.banca?"Banca: "+a.banca:"Banca não informada no trecho";
  }
  function stamp(st){
    const cls = (st==="aberto"||st==="fecha-7")?"solid": st==="fechado"?"mute":"ghost";
    const lab = st==="fecha-7" ? "Fecha em<br>7 dias" : STATUS[st];
    return '<span class="stamp '+cls+'">'+lab+'</span>';
  }
  function brand(){ return '<div class="brand"><span class="dot"></span>Radar dos Editais</div>'; }
  function nav(active){
    const items=[["/" ,"Radar"],["/alertas","Alertas"],["/conta","Conta"]];
    return items.map(([h,l])=>'<a href="'+h+'" class="'+(active===h|| (active==="/"&&h==="/")? "on":"")+'">'+l+'</a>').join("");
  }

  let state = {
    itens: [], fontes: [], user: null, loading: true,
    filters: { q:"", cidade:"João Pessoa", status:"aberto", tipo:"todos", esfera:"todos" },
    draft: null, sheet: false, selected: null, err: null, busy: false, saved: false
  };

  async function api(path, opts){
    const r = await fetch(path, Object.assign({ credentials:"same-origin", headers: {"content-type":"application/json"} }, opts||{}));
    const t = await r.text();
    let d=null; try{ d=t?JSON.parse(t):null; }catch(e){ d={error:t}; }
    if(!r.ok) throw Object.assign(new Error((d&&d.error)||"falha"), {status:r.status, data:d});
    return d;
  }

  async function boot(){
    try {
      const [ed, fo, me] = await Promise.all([
        api("/api/editais"),
        api("/api/fontes"),
        api("/api/me").catch(()=>null)
      ]);
      state.itens = withStatus(ed.data||[]);
      state.fontes = fo.data||[];
      state.user = me && me.user ? me.user : null;
      if(me && me.user && me.user.cidade && path()==="/") state.filters.cidade = me.user.cidade;
    } catch(e) {
      state.err = "Não deu para ler os atos agora.";
    }
    state.loading = false;
    render();
  }

  function card(a, selected){
    return '<article class="card '+(selected?"sel":"")+'">'+
      '<button class="body" data-open="'+esc(a.id)+'">'+
        '<div class="row"><h2>'+esc(a.orgao)+'</h2>'+stamp(a.status)+'</div>'+
        '<p class="meta">'+esc(TIPO[a.tipo])+' · '+esc(a.cidade)+' · '+esc(ESFERA[a.esfera])+'</p>'+
        '<p class="prazo">'+esc(prazo(a))+'</p>'+
        '<p class="fonte">'+esc(a.fonteId)+' nº '+esc(a.edicao)+' · '+br(a.data)+'</p>'+
      '</button>'+
      '<a class="pdf" href="'+esc(a.fonteUrl)+'" target="_blank" rel="noreferrer">Abrir PDF oficial <span>↗</span></a>'+
    '</article>';
  }

  function detail(a){
    if(!a) return '<div class="detail" style="place-items:center;display:grid;color:var(--muted)">Escolha um ato na lista.</div>';
    const copy = a.tipo==="convocacao" && a.status==="aberto" ? "Convocação vigente" :
      (a.status==="aberto"||a.status==="fecha-7") ? "Inscrição vigente" :
      a.status==="previsto" ? "Autorizado, sem inscrição" : "Prazo encerrado";
    const dates = (a.inscricoesDe||a.inscricoesAte) ? '<div class="dates"><div><span>Inscrições de</span><b>'+br(a.inscricoesDe)+'</b></div><div><span>Até</span><b>'+br(a.inscricoesAte)+'</b></div></div>' : '';
    return '<div class="detail">'+
      '<div class="scroll">'+
        '<p class="k">'+esc(TIPO[a.tipo])+' · '+esc(a.cidade)+' · '+esc(ESFERA[a.esfera])+'</p>'+
        '<h1>'+esc(a.orgao)+'</h1>'+
        '<p class="prazo">'+esc(a.titulo)+'</p>'+
        '<div class="row" style="border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 0;gap:14px">'+stamp(a.status)+'<p class="prazo">'+esc(copy)+'</p></div>'+
        dates+
        '<div><p class="k">Banca</p><p>'+esc(a.banca||"Não informada no trecho extraído")+'</p></div>'+
        '<div><p class="k">Trecho extraído do PDF</p><blockquote>“'+esc(a.trecho||"")+'”</blockquote><p class="fonte">Trecho literal. Sem resumo automático.</p></div>'+
        '<div class="box"><p class="k">Fonte</p>Diário Oficial do Estado da Paraíba (DOE-PB)<br>'+esc(a.fonteId)+' nº '+esc(a.edicao)+' · '+br(a.data)+'<br>Método: texto nativo do PDF oficial</div>'+
      '</div>'+
      '<div class="foot">'+
        '<a class="btn" href="'+esc(a.fonteUrl)+'" target="_blank" rel="noreferrer">Abrir PDF ↗</a>'+
        '<button class="btn ghost" data-alert="'+esc(a.id)+'">'+(state.saved?"Alerta salvo":"Salvar alerta")+'</button>'+
      '</div></div>';
  }

  function radarView(){
    const vis = sortAtos(filterAtos(state.itens, state.filters));
    const abertos = vis.filter(a=>a.status==="aberto"||a.status==="fecha-7").length;
    const doe = state.fontes.find(f=>f.id==="DOE-PB");
    const dom = state.fontes.find(f=>f.id==="DOM-JP");
    const selId = state.selected || (vis[0]&&vis[0].id);
    const sel = vis.find(a=>a.id===selId) || vis[0];
    const fail = (dom && dom.status==="falha" && state.filters.cidade==="João Pessoa") ?
      '<aside class="fail"><div class="k"><span class="dot"></span>Falha de fonte · DOM-JP</div><p>'+esc(dom.motivo||"Não deu para ler o diário municipal (site bloqueou). O estadual está abaixo.")+'</p><p class="m">Nenhuma edição municipal lida ainda.</p><button data-retry="1">Tentar de novo</button></aside>' : '';
    const chips =
      '<button class="chip '+(state.filters.cidade!=="todas"?"on":"")+'" data-sheet="1">'+(state.filters.cidade==="todas"?"Cidade ▾":esc(state.filters.cidade)+" ▾")+'</button>'+
      '<button class="chip stamp '+(state.filters.status!=="todos"?"on":"")+'" data-sheet="1">'+(state.filters.status==="todos"?"Status":STATUS[state.filters.status])+'</button>'+
      '<button class="chip '+(state.filters.tipo!=="todos"?"on":"")+'" data-sheet="1">'+(state.filters.tipo==="todos"?"Tipo ▾":TIPO[state.filters.tipo]+" ▾")+'</button>';
    const list = vis.length===0 ?
      '<div class="empty"><h2>'+(state.filters.cidade==="todas"?"Nenhum edital com esses filtros.":"Nenhum edital aberto em "+esc(state.filters.cidade)+" nesta edição.")+'</h2><p>A edição do DOE-PB foi lida: '+state.itens.length+' atos extraídos. O filtro é que zerou, não a fonte.</p><button class="btn" data-all="1">Ver todas as cidades</button></div>' :
      vis.map(a=>card(a, sel&&sel.id===a.id)).join("");
    const src = doe ? ('DOE-PB nº '+esc(doe.edicao||"")+(doe.data||doe.dataEdicao?' · '+br(doe.data||doe.dataEdicao):'')+' · <strong>lido hoje</strong>') : 'DOE-PB · aguardando leitura';
    return '<div class="shell">'+
      '<header class="top">'+brand()+'<span class="city-m">'+(state.filters.cidade==="todas"?"Paraíba":esc(state.filters.cidade))+'</span>'+
      '<form class="search" onsubmit="return false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg><input id="qdesk" placeholder="Buscar órgão, cargo ou banca" value="'+esc(state.filters.q)+'" /></form>'+
      '<nav class="desk">'+nav("/")+'</nav></header>'+
      '<div class="src"><span>'+src+'</span><span class="desk-only" style="color:var(--muted)">DOM-JP: '+(dom&&dom.status==="ok"?"lido":"bloqueado")+' · Próxima leitura: 06:00</span></div>'+
      '<div class="split"><section class="col">'+
        '<div class="q-m"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg><input id="qmob" placeholder="Buscar órgão, cargo ou banca" value="'+esc(state.filters.q)+'" /></div></div>'+
        '<div class="chips">'+chips+'</div><p class="count">'+abertos+' '+(abertos===1?"aberto":"abertos")+' nesta leitura</p>'+
        fail+'<div class="list">'+list+'</div></section>'+
        '<aside class="ficha">'+detail(sel)+'</aside></div>'+
      filterSheet()+
      '<nav class="bottom">'+nav("/")+'</nav></div>';
  }

  function filterSheet(){
    const d = state.draft || state.filters;
    const preview = filterAtos(state.itens, d);
    const ab = preview.filter(a=>a.status==="aberto"||a.status==="fecha-7").length;
    const q = (d._cq||"");
    const cidades = CIDADES.filter(c => !q || c.toLowerCase().includes(q.toLowerCase()));
    const cityBtns = ['<button class="'+(d.cidade==="João Pessoa"?"on":"")+'" data-cidade="João Pessoa">João Pessoa</button>',
      '<button class="'+(d.cidade==="todas"?"on":"")+'" data-cidade="todas">Todas as cidades da Paraíba</button>']
      .concat(cidades.filter(c=>c!=="João Pessoa").map(c=>'<button class="'+(d.cidade===c?"on":"")+'" data-cidade="'+esc(c)+'">'+esc(c)+'</button>')).join("");
    const st = [["aberto","Aberto (inscrição vigente)"],["fecha-7","Fecha em 7 dias"],["fechado","Fechado"],["previsto","Previsto (autorizado, sem inscrição)"]];
    return '<div class="drawer '+(state.sheet?"open":"")+'" id="drawer"><div class="bg" data-close="1"></div><div class="sheet">'+
      '<div class="hh"><h2>Filtros</h2><button class="chip" data-clear="1" style="border:0;color:var(--stamp-ink)">Limpar</button></div>'+
      '<div class="body">'+
        '<section><h3>Cidade</h3><input class="q" id="cq" placeholder="Buscar município" value="'+esc(q)+'" style="padding-left:12px;margin-bottom:8px" /><div class="clist">'+cityBtns+'</div></section>'+
        '<section><h3>Status</h3><div class="ff">'+st.map(([id,l])=>'<button class="chip '+(d.status===id?"on":"")+'" data-status="'+id+'">'+l+'</button>').join("")+'</div></section>'+
        '<section><h3>Esfera</h3><div class="ff">'+["municipal","estadual","federal"].map(e=>'<button class="chip '+(d.esfera===e?"on":"")+'" data-esfera="'+e+'">'+ESFERA[e]+'</button>').join("")+'</div></section>'+
        '<section><h3>Tipo</h3><div class="ff">'+Object.keys(TIPO).map(t=>'<button class="chip '+(d.tipo===t?"on":"")+'" data-tipo="'+t+'">'+TIPO[t]+'</button>').join("")+'</div></section>'+
      '</div>'+
      '<div class="bar"><p>'+ab+' '+(ab===1?"aberto":"abertos")+'</p><button class="btn ghost" data-clear="1" style="width:auto;padding:0 14px">Limpar</button><button class="btn" data-apply="1" style="width:auto;padding:0 20px">Aplicar</button></div>'+
    '</div></div>';
  }

  function authFrame(title, inner, footer, back){
    return '<div class="auth">'+(back?'<a class="back" href="'+back.href+'"><b>‹</b> <b>'+esc(back.label)+'</b></a>':'<header class="top">'+brand()+'</header>')+
      '<main><div><h1>'+esc(title)+'</h1>'+(inner.kicker?'<p class="kicker">'+esc(inner.kicker)+'</p>':'')+'</div>'+inner.html+'</main>'+
      '<footer>'+esc(footer)+'</footer></div>';
  }

  function loginView(){
    return authFrame("Entrar", {
      kicker: "Atos do Diário Oficial da Paraíba, lidos todo dia útil.",
      html: (state.err?'<div class="err"><i></i>'+esc(state.err)+'</div>':'')+
        '<form id="f-login" class="field" style="gap:16px;display:flex;flex-direction:column">'+
        '<label class="field"><span>E-mail</span><input name="email" type="email" required autocomplete="email" placeholder="voce@exemplo.com.br" /></label>'+
        '<label class="field"><span>Senha</span><input name="password" type="password" required autocomplete="current-password" /></label>'+
        '<button class="btn" type="submit">'+(state.busy?"Entrando…":"Entrar")+'</button></form>'+
        '<a href="/criar-conta" style="color:var(--stamp);font-weight:600;min-height:44px;display:flex;align-items:center">Criar conta</a>'
    }, "Os atos vêm do Diário Oficial. Sem lista fake.");
  }

  function signupView(){
    return authFrame("Sua conta", {
      html: (state.err?'<div class="err"><i></i>'+esc(state.err)+'</div>':'')+
        '<form id="f-signup" style="display:flex;flex-direction:column;gap:16px">'+
        '<label class="field"><span>E-mail</span><input name="email" type="email" required autocomplete="email" placeholder="voce@exemplo.com.br" /></label>'+
        '<label class="field"><span>Senha</span><input name="password" type="password" required minlength="8" placeholder="mínimo 8 caracteres" /></label>'+
        '<label class="field"><span>Confirmar senha</span><input name="confirm" type="password" required /></label>'+
        '<label class="field"><span>Cidade padrão</span><select name="cidade">'+CIDADES.map(c=>'<option '+(c==="João Pessoa"?"selected":"")+'>'+esc(c)+'</option>').join("")+'</select><span style="text-transform:none;letter-spacing:0;font-weight:400">Depois você troca ou acompanha todas as cidades da Paraíba.</span></label>'+
        '<button class="btn" type="submit">'+(state.busy?"Criando…":"Criar conta")+'</button></form>'
    }, "Cadastro só por e-mail e senha.", {href:"/login", label:"Criar conta"});
  }

  function alertasView(){
    if(!state.user) { go("/login"); return loginView(); }
    const rows = state.alerts || [];
    const list = rows.length===0 ?
      '<div style="padding:32px 16px"><div class="empty"><h2>Nenhum alerta. Escolhe uma cidade no radar.</h2><p>Filtre a cidade e o tipo no radar e toque em “Salvar alerta” na ficha do ato.</p><a class="btn" href="/" style="margin-top:16px">Ir para o radar</a></div></div>' :
      '<ul style="list-style:none;margin:0;padding:0">'+rows.map(r=>
        '<li class="rowline"><div style="flex:1"><p style="margin:0;font-family:var(--display);font-weight:600">'+(esc(r.cidade))+' · '+(TIPO[r.tipo]||r.tipo)+'</p><p class="fonte" style="margin:4px 0 0">'+(r.enabled?"Municipal e estadual · só quando abrir":"Desligado — nada será enviado")+'</p></div>'+
        '<button class="sw '+(r.enabled?"on":"")+'" data-tog="'+r.id+'" aria-label="Alerta"><i></i></button></li>'
      ).join("")+'<li style="padding:16px"><a class="btn ghost" href="/">Novo alerta</a><p class="fonte" style="margin-top:10px">O aviso sai depois que a edição do dia é lida — em geral antes das 8h nos dias úteis.</p></li></ul>';
    return '<div class="page"><header class="top" style="justify-content:space-between">'+brand()+'<nav class="desk">'+nav("/alertas")+'</nav></header>'+
      '<div class="hd"><h1>Alertas</h1><p class="lead">Te aviso quando o DOE do dia tiver concurso aberto na cidade que você seguir.</p></div>'+
      list+'<nav class="bottom">'+nav("/alertas")+'</nav></div>';
  }

  function contaView(){
    if(!state.user) { go("/login"); return loginView(); }
    const u = state.user;
    return '<div class="page"><header class="top" style="justify-content:space-between">'+brand()+'<nav class="desk">'+nav("/conta")+'</nav></header>'+
      '<div class="hd"><h1>Conta</h1></div>'+
      '<div class="rowline" style="flex-direction:column;align-items:flex-start;gap:4px"><span class="lab">E-mail</span><span>'+esc(u.email)+'</span></div>'+
      '<div class="rowline"><div style="flex:1"><span class="lab">Cidade padrão</span><div>'+(state.editingCity
        ? '<select id="cid">'+CIDADES.map(c=>'<option '+(c===u.cidade?"selected":"")+'>'+esc(c)+'</option>').join("")+'</select>'
        : '<p style="margin:4px 0 0">'+esc(u.cidade||"João Pessoa")+'</p>')+'</div></div>'+(state.editingCity?"":'<button data-editc="1" style="border:0;background:none;color:var(--stamp-ink);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;min-height:44px">Trocar</button>')+'</div>'+
      '<div class="rowline" style="flex-direction:column;align-items:flex-start"><span class="lab">Fontes acompanhadas</span><span style="font-size:14px">DOE-PB (estadual) · DOM-JP (municipal, bloqueado)</span></div>'+
      '<div class="rowline"><a href="/whatsapp" style="flex:1;display:flex;justify-content:space-between;text-decoration:none;font-weight:600"><span>Aviso por WhatsApp</span><span class="lab">'+(u.whatsapp?"Ativo":"Opt-in")+'</span></a></div>'+
      '<div style="padding:20px 16px"><button class="btn stamp" data-out="1">Sair</button></div>'+
      '<nav class="bottom">'+nav("/conta")+'</nav></div>';
  }

  function whatsappView(){
    if(!state.user) { go("/login"); return loginView(); }
    const u=state.user;
    return '<div class="auth"><a class="back" href="/conta"><b>‹</b> <b>WhatsApp</b></a>'+
      '<div class="hd"><h1>Aviso por WhatsApp</h1><p class="lead">Só com sua autorização. Uma mensagem por dia útil, no máximo.</p></div>'+
      '<form id="f-wa" style="padding:20px 16px;display:flex;flex-direction:column;gap:20px;flex:1">'+
      '<label class="field"><span>Número com DDD</span><input name="whatsapp" required inputmode="tel" placeholder="(83) 90000-0000" value="'+esc(u.whatsapp||"")+'" /></label>'+
      '<label class="field"><span>Cidade</span><select name="cidade">'+CIDADES.map(c=>'<option '+(c===(u.cidade||"João Pessoa")?"selected":"")+'>'+esc(c)+'</option>').join("")+'</select></label>'+
      '<button class="btn" type="submit">'+(state.busy?"Salvando…":"Ativar aviso")+'</button>'+
      (state.saved?'<div class="ok">Número guardado. O envio diário sai depois da leitura do DOE — a mensagem cita a edição e o PDF.</div>':'')+
      '</form></div>';
  }

  function fichaView(id){
    const a = state.itens.find(x=>x.id===id);
    if(!a) return '<div class="auth" style="padding:64px 16px;text-align:center"><h1>Ato não encontrado</h1><p class="lead">Ele não está no catálogo desta leitura.</p><a class="btn" href="/" style="margin-top:24px">Voltar ao radar</a></div>';
    return '<div class="page" style="max-width:36rem;margin:0 auto">'+
      '<a class="back" href="/"><b>‹</b> <b>Ficha do ato</b></a>'+detail(a)+'</div>';
  }

  function render(){
    const p = path();
    let html = "";
    if(state.loading) html = '<div class="auth" style="padding:48px 20px">'+brand()+'<p class="lead" style="margin-top:24px">Lendo o DOE…</p></div>';
    else if(p==="/login") html = loginView();
    else if(p==="/criar-conta") html = signupView();
    else if(p==="/alertas") html = alertasView();
    else if(p==="/conta") html = contaView();
    else if(p==="/whatsapp") html = whatsappView();
    else if(p.startsWith("/edital/")) html = fichaView(decodeURIComponent(p.slice(8)));
    else html = radarView();
    document.getElementById("root").innerHTML = html;
    bind();
  }

  function bind(){
    document.querySelectorAll("a[href^='/']").forEach(a=>{
      a.addEventListener("click", (e)=>{ if(e.metaKey||e.ctrlKey) return; e.preventDefault(); go(a.getAttribute("href")); });
    });
    const qdesk=$("#qdesk"), qmob=$("#qmob");
    function onq(ev){ state.filters.q = ev.target.value; /* don't full rerender on each key — update other field */ if(qdesk&&qdesk!==ev.target) qdesk.value=ev.target.value; if(qmob&&qmob!==ev.target) qmob.value=ev.target.value; }
    if(qdesk){ qdesk.addEventListener("input", (e)=>{ onq(e); clearTimeout(window._t); window._t=setTimeout(()=>render(), 180); }); }
    if(qmob){ qmob.addEventListener("input", (e)=>{ onq(e); clearTimeout(window._t); window._t=setTimeout(()=>render(), 180); }); }
    document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click", ()=>{
      const id=b.getAttribute("data-open");
      if(window.matchMedia("(min-width:1024px)").matches){ state.selected=id; state.saved=false; render(); }
      else go("/edital/"+id);
    }));
    document.querySelectorAll("[data-sheet]").forEach(b=>b.addEventListener("click", ()=>{ state.sheet=true; state.draft=Object.assign({}, state.filters); render(); }));
    document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click", ()=>{ state.sheet=false; render(); }));
    document.querySelectorAll("[data-clear]").forEach(b=>b.addEventListener("click", ()=>{
      const q=state.filters.q; state.draft={q, cidade:"todas", status:"todos", tipo:"todos", esfera:"todos"}; render();
    }));
    document.querySelectorAll("[data-apply]").forEach(b=>b.addEventListener("click", ()=>{ state.filters=Object.assign({}, state.draft||state.filters); state.sheet=false; state.selected=null; render(); }));
    document.querySelectorAll("[data-cidade]").forEach(b=>b.addEventListener("click", ()=>{ state.draft=Object.assign({}, state.draft||state.filters, {cidade:b.getAttribute("data-cidade")}); render(); }));
    document.querySelectorAll("[data-status]").forEach(b=>b.addEventListener("click", ()=>{ const v=b.getAttribute("data-status"); const d=Object.assign({}, state.draft||state.filters); d.status = d.status===v?"todos":v; state.draft=d; render(); }));
    document.querySelectorAll("[data-tipo]").forEach(b=>b.addEventListener("click", ()=>{ const v=b.getAttribute("data-tipo"); const d=Object.assign({}, state.draft||state.filters); d.tipo = d.tipo===v?"todos":v; state.draft=d; render(); }));
    document.querySelectorAll("[data-esfera]").forEach(b=>b.addEventListener("click", ()=>{ const v=b.getAttribute("data-esfera"); const d=Object.assign({}, state.draft||state.filters); d.esfera = d.esfera===v?"todos":v; state.draft=d; render(); }));
    const cq=$("#cq"); if(cq) cq.addEventListener("input", (e)=>{ state.draft=Object.assign({}, state.draft||state.filters, {_cq:e.target.value}); render(); cq.focus(); const el=$("#cq"); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} });
    document.querySelectorAll("[data-all]").forEach(b=>b.addEventListener("click", ()=>{ state.filters.cidade="todas"; state.filters.status="todos"; render(); }));
    document.querySelectorAll("[data-retry]").forEach(b=>b.addEventListener("click", async ()=>{ try{ const fo=await api("/api/ingest"); /* refresh fontes */ const f=await api("/api/fontes"); state.fontes=f.data||[]; render(); }catch(e){} }));
    document.querySelectorAll("[data-alert]").forEach(b=>b.addEventListener("click", async ()=>{
      if(!state.user){ go("/login"); return; }
      const id=b.getAttribute("data-alert");
      const a=state.itens.find(x=>x.id===id); if(!a) return;
      try{ await api("/api/alerts",{method:"POST", body:JSON.stringify({cidade:a.cidade, tipo:a.tipo, enabled:true})}); state.saved=true; render(); }
      catch(e){ go("/login"); }
    }));
    const fl=$("#f-login"); if(fl) fl.addEventListener("submit", async (e)=>{
      e.preventDefault(); state.busy=true; state.err=null; render();
      const fd=new FormData(fl);
      try{ const u=await api("/api/auth/login",{method:"POST", body:JSON.stringify({email:fd.get("email"), password:fd.get("password")})}); state.user=u.user; state.busy=false; go("/"); }
      catch(err){ state.busy=false; state.err="E-mail ou senha errados."; render(); }
    });
    const fs=$("#f-signup"); if(fs) fs.addEventListener("submit", async (e)=>{
      e.preventDefault(); const fd=new FormData(fs);
      if(String(fd.get("password")).length<8){ state.err="A senha precisa ter pelo menos 8 caracteres."; render(); return; }
      if(fd.get("password")!==fd.get("confirm")){ state.err="As senhas não conferem."; render(); return; }
      state.busy=true; state.err=null; render();
      try{ const u=await api("/api/auth/signup",{method:"POST", body:JSON.stringify({email:fd.get("email"), password:fd.get("password"), cidade:fd.get("cidade")})}); state.user=u.user; state.busy=false; go("/"); }
      catch(err){ state.busy=false; state.err=(err.data&&err.data.error)||"Não deu para criar a conta."; render(); }
    });
    document.querySelectorAll("[data-out]").forEach(b=>b.addEventListener("click", async ()=>{ await api("/api/auth/logout",{method:"POST", body:"{}"}); state.user=null; go("/login"); }));
    document.querySelectorAll("[data-editc]").forEach(b=>b.addEventListener("click", ()=>{ state.editingCity=true; render(); }));
    const cid=$("#cid"); if(cid) cid.addEventListener("change", async ()=>{ await api("/api/profile",{method:"POST", body:JSON.stringify({cidade:cid.value})}); state.user.cidade=cid.value; state.editingCity=false; render(); });
    document.querySelectorAll("[data-tog]").forEach(b=>b.addEventListener("click", async ()=>{
      const id=Number(b.getAttribute("data-tog"));
      const row=(state.alerts||[]).find(x=>x.id===id); if(!row) return;
      row.enabled=!row.enabled; render();
      await api("/api/alerts/toggle",{method:"POST", body:JSON.stringify({id, enabled:row.enabled})}).catch(()=>{ row.enabled=!row.enabled; render(); });
    }));
    const fwa=$("#f-wa"); if(fwa) fwa.addEventListener("submit", async (e)=>{
      e.preventDefault(); const fd=new FormData(fwa); state.busy=true; render();
      try{ await api("/api/profile",{method:"POST", body:JSON.stringify({whatsapp:fd.get("whatsapp"), cidade:fd.get("cidade")})}); state.user.whatsapp=fd.get("whatsapp"); state.user.cidade=fd.get("cidade"); state.saved=true; }catch(e){}
      state.busy=false; render();
    });
    if(path()==="/alertas" && state.user && !state.alerts){
      api("/api/alerts").then(d=>{ state.alerts=d.data||[]; render(); }).catch(()=>{ state.alerts=[]; render(); });
    }
  }

  window.addEventListener("popstate", render);
  boot();
  </script>
</body>
</html>
